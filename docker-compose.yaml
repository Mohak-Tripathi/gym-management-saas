# ---

# ### 🧪 Sample `.env` file:

# ```env
# PORT=4000
# DATABASE_URL=postgresql://postgres:password@db:5432/gym_db
# ```

# > ✅ `@db` works inside Docker network to reference the service name of the Postgres container (`db`).

# ---

# ### Summary

# | Location         | Purpose                                    |
# |------------------|---------------------------------------------|
# | `.env`           | Used by local tooling & app configs         |
# | `docker-compose` | Injects environment into container runtime  |
# | `env_file:`      | Lets Docker use `.env` directly — DRY setup ✅ |

